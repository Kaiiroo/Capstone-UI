<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuadaHealth Records</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">✚</div>
          <div>
            <h2><span class="brand-guada">Guada</span><span class="brand-health">Health</span></h2>
            <p>Clinical note workspace</p>
          </div>
        </div>

        <nav class="nav-links nav-links-vertical" aria-label="Primary">
          <a class="nav-btn" href="dashboard.html">Dashboard</a>
          <a class="nav-btn" href="transcript.html">Transcribe</a>
          <a class="nav-btn active" href="records.html" aria-current="page">Records</a>
        </nav>

        <div class="sidebar-card">
          <button id="logout-btn" class="ghost-btn" type="button">Sign out</button>
        </div>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">GuadaHealth Institution</p>
          </div>
          <div class="topbar-actions">
            <div id="auth-status" class="status-pill">Not signed in</div>
          </div>
        </header>

        <main class="content">
          <section class="card">
            <div class="card-header">
              <h2>Saved note records</h2>
              <p>Review, search, and update transcribed entries stored for the institution.</p>
            </div>
            <div class="toolbar">
              <input id="search-input" type="search" placeholder="Search notes..." />
              <select id="status-filter" aria-label="Filter note status">
                <option value="all">All statuses</option>
                <option value="Pending review">Pending review</option>
                <option value="Reviewed">Reviewed</option>
              </select>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Source</th>
                    <th>Status</th>
                    <th>Saved</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="records-table-body"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
    <div id="record-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="record-modal-title">
        <div class="modal-header">
          <div>
            <p class="eyebrow">Saved record</p>
            <h2 id="record-modal-title">Edit transcription</h2>
          </div>
          <button id="record-modal-close" class="ghost-btn modal-close-btn" type="button" aria-label="Close editor">Close</button>
        </div>
        <div class="modal-meta">
          <div>
            <span class="modal-label">Source</span>
            <strong id="record-modal-source"></strong>
          </div>
          <div>
            <span class="modal-label">Status</span>
            <strong id="record-modal-status"></strong>
          </div>
          <div>
            <span class="modal-label">Saved</span>
            <strong id="record-modal-saved-at"></strong>
          </div>
        </div>
        <label class="modal-field">
          Transcription text
          <textarea id="record-modal-transcription" rows="12"></textarea>
        </label>
        <div class="modal-actions">
          <button id="record-modal-cancel" class="ghost-btn" type="button">Cancel</button>
          <button id="record-modal-save" type="button">Save changes</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/records-page.js"></script>
  </body>
</html>
