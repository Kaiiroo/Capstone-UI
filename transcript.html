<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuadaHealth Transcribe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-pending">
    <script>
      try {
        if (sessionStorage.getItem('gh-authed')) document.body.classList.remove('auth-pending');
      } catch {}
    </script>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-icon" src="assets/guadahealth-logo.png" alt="GuadaHealth logo" />
          <div>
            <h2><span class="brand-guada">Guada</span><span class="brand-health">Health</span></h2>
            <p>Clinical note workspace</p>
          </div>
        </div>

        <nav class="nav-links nav-links-vertical" aria-label="Primary">
          <a class="nav-btn" href="dashboard.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</a>
          <a class="nav-btn active" href="transcript.html" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Transcribe</a>
          <a class="nav-btn" href="records.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg>Records</a>
        </nav>

        <div class="sidebar-card">
          <button id="logout-btn" class="ghost-btn" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</button>
        </div>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">GuadaHealth Institution</p>
          </div>
          <div class="topbar-actions">
            <div id="auth-status" class="status-pill">Not signed in</div>
          </div>
        </header>

        <main class="content">
          <section class="card">
            <div class="card-header">
              <h2>Upload and transcribe</h2>
              <p>Attach a scanned note, add context, and create a readable transcription.</p>
            </div>
            <form id="scanner-form" class="stacked-form">
              <div class="form-row">
                <label>
                  Document file
                  <input id="file-input" type="file" accept="image/*,.pdf" />
                </label>
                <label>
                  Prescribing doctor
                  <input id="source-input" type="text" placeholder="Example: Dr. Juan Santos" />
                </label>
              </div>
              <div id="file-preview" class="file-preview" aria-live="polite">
                <div id="file-preview-placeholder" class="file-preview-placeholder">
                  Image preview will appear here after upload.
                </div>
                <img id="file-preview-image" alt="Uploaded document preview" hidden />
              </div>
              <div class="scan-slot">
                <button id="scan-button" type="button" class="secondary-btn">Generate transcription preview</button>
                <div id="transcription-progress" class="transcription-progress" role="progressbar" aria-label="Transcription progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
                  <div class="progress"></div>
                  <span id="transcription-progress-label" class="progress-label">Preparing document…</span>
                  <span id="transcription-progress-value" class="progress-value">0%</span>
                </div>
              </div>
              <textarea id="transcription-output" rows="10" placeholder="The transcription preview will appear here..."></textarea>
              <div class="button-row">
                <button id="save-button" type="submit">Save note</button>
                <button id="clear-button" type="button" class="ghost-btn">Clear form</button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script>
      window.setTimeout(() => {
        if (document.body.classList.contains('auth-pending')) {
          window.location.replace('login.html');
        }
      }, 10000);
    </script>
    <script type="module" src="js/pages/transcript-page.js"></script>
  </body>
</html>
